<style>
/* Mapa Eleitoral: base visual própria, neutra e clara (tokens, tipografia e componentes).
   Os nomes dos tokens (--gold etc.) são mantidos por compatibilidade; o valor é o azul de destaque.
   --ca e --cb são as cores de comparação entre candidaturas, escolhidas fora das cores partidárias. */
:root{
  color-scheme: light;
  --bg:#ffffff; --bg-2:#f5f7fa; --bg-3:#eceff4; --line:#dde2ea; --line-soft:#eaedf2;
  --ink:#16202c; --ink-2:#465264; --ink-3:#6b7686;
  --gold:#2f5bd3; --gold-ink:#2449b3; --gold-wash:rgba(47,91,211,.08);
  --warn:#b4472f; --warn-wash:rgba(180,71,47,.07); --ok:#2f7d55; --mid:#9a6b12;
  --page:#f7f8fb; --shadow:0 1px 2px rgba(22,32,44,.05),0 4px 14px rgba(22,32,44,.05);
  --ca:#008f80; --ca-wash:rgba(0,143,128,.09); --cb:#6a4bc4; --cb-wash:rgba(106,75,196,.09);
  --serif:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#161b22; --bg-2:#1c232c; --bg-3:#242c37; --line:#2f3946; --line-soft:#252e3a;
  --ink:#e8edf3; --ink-2:#b3bdca; --ink-3:#8793a3;
  --gold:#7c9cf0; --gold-ink:#9db5f5; --gold-wash:rgba(124,156,240,.12);
  --warn:#e58c74; --warn-wash:rgba(229,140,116,.1); --ok:#6cc495; --mid:#e0b45c;
  --page:#10141a; --shadow:0 1px 2px rgba(0,0,0,.3);
  --ca:#1fa99c; --ca-wash:rgba(31,169,156,.12); --cb:#9277e6; --cb-wash:rgba(146,119,230,.12);
} }
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161b22; --bg-2:#1c232c; --bg-3:#242c37; --line:#2f3946; --line-soft:#252e3a;
  --ink:#e8edf3; --ink-2:#b3bdca; --ink-3:#8793a3;
  --gold:#7c9cf0; --gold-ink:#9db5f5; --gold-wash:rgba(124,156,240,.12);
  --warn:#e58c74; --warn-wash:rgba(229,140,116,.1); --ok:#6cc495; --mid:#e0b45c;
  --page:#10141a; --shadow:0 1px 2px rgba(0,0,0,.3);
  --ca:#1fa99c; --ca-wash:rgba(31,169,156,.12); --cb:#9277e6; --cb-wash:rgba(146,119,230,.12);
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 56px}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:20px 14px}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none}
.brand svg{width:36px;height:36px;display:block;color:var(--gold)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{font-weight:700;font-size:clamp(22px,3vw,28px);letter-spacing:-.02em;line-height:1.1;margin:0}
h1 em{font-style:normal;color:var(--gold)}
.status{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.status b{color:var(--ink);font-weight:500}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.pulse.off{background:var(--warn)}
nav.tabs-scroll{overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:2px;min-width:max-content}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font-size:14px;padding:10px 12px 9px;cursor:pointer;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--gold-ink);border-bottom-color:var(--gold);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:4px}

/* Typography */
h2{font-weight:650;font-size:22px;margin:0;letter-spacing:-.015em;text-wrap:balance}
h3{font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.page-head{padding-block:28px 6px}
.page-head h2{font-size:clamp(24px,3.2vw,32px);font-weight:700;letter-spacing:-.025em}
.crumbs{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--gold-ink)}
.lede{font-size:16px;color:var(--ink);max-width:72ch;margin:12px 0 0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
section.blk{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.sec-note{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
@media (max-width:960px){.grid2{grid-template-columns:1fr;gap:28px}}
aside.side{display:flex;flex-direction:column;gap:30px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;letter-spacing:0;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.badge.gold{border-color:var(--gold);color:var(--gold-ink)}
.badge.solid{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.ia::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip.p{border-style:dashed}
.chip.c{border-style:dotted}
.chip[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--ink)}
.chip.dis{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ref{color:var(--gold-ink);text-decoration:none;border-bottom:1px solid transparent}
.ref:hover{border-bottom-color:var(--gold)}

/* Search */
.hero{padding-block:44px 8px;max-width:820px}
.hero h2{font-size:clamp(28px,4vw,42px);font-weight:750;line-height:1.1;letter-spacing:-.03em}
.hero p{color:var(--ink-2);margin:10px 0 0;max-width:62ch}
form.search{margin-top:22px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:4px 6px 4px 14px;background:var(--bg-2)}
form.search:focus-within{border-color:var(--gold)}
form.search input{flex:1;min-width:0;background:none;border:0;font-size:16px;padding:11px 0;outline:none}
form.search svg{flex:none;color:var(--ink-3)}
.btn{appearance:none;text-decoration:none;display:inline-block;border:1px solid var(--gold);background:var(--gold);color:#fff;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:8px;transition:filter .15s,transform .15s;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--gold-ink)}
.btn.quiet{background:none;border-color:var(--line);color:var(--ink-2);font-weight:400}
.btn.quiet:hover{border-color:var(--gold);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.examples{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.examples span{font-size:12px;color:var(--ink-3);margin-right:4px}

/* Home cards */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.area{padding:14px 16px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);text-decoration:none;display:flex;flex-direction:column;gap:3px}
.area:hover{background:var(--bg-2)}
.area b{font-weight:500;font-size:15px}
.area span{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.area.soon b{color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;text-decoration:none;align-items:baseline}
.row:hover .rt{color:var(--gold-ink)}
.rt{font-weight:600;font-size:16px;line-height:1.3}
.rs{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:78ch}
.rm{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

/* Legal text */
.lex{border-left:2px solid var(--gold);padding:4px 0 4px 18px;margin:0}
.lex p{margin:0 0 6px;max-width:78ch}
.lex p.cap{font-size:15.5px}
.lex p.sub{padding-left:18px;color:var(--ink)}
.lex .nt{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}
.lex .nt.new{color:var(--gold-ink)}
.srcline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3)}
.srcline a{color:var(--gold-ink)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--bg-2)}
tr:last-child td{border-bottom:0}
td.k{color:var(--ink-3);white-space:nowrap}
.cmp td{min-width:220px}
.cmp td.k{min-width:140px}

/* Alerts */
.alert{border:1px solid var(--warn);background:var(--warn-wash);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.alert .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--warn);text-transform:uppercase}
.alert h3{font-size:18px;margin:4px 0 6px}
.alert p{margin:6px 0 0;font-size:14px;max-width:78ch}
.alert .rep{color:var(--ink-2);font-size:13.5px}

/* Relations list */
.rel{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rel .l{display:flex;flex-direction:column;gap:6px}
.rel .l a{font-weight:600;font-size:15.5px;text-decoration:none}
.rel .l a:hover{color:var(--gold-ink)}
.rel p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:72ch}
@media (max-width:560px){.rel{grid-template-columns:1fr}}

/* Notes */
.note{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.note .who{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note p{margin:4px 0 0;font-size:14px;white-space:pre-wrap;max-width:78ch}
form.nf{display:grid;gap:8px;margin-top:12px}
textarea,input[type=text],select{background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;width:100%}
textarea{min-height:80px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--gold);outline:none}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow > *{flex:1 1 180px}
.frow .btn{flex:0 0 auto}

/* Actions bar */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.pop{position:relative}
.menu{position:absolute;z-index:5;top:calc(100% + 6px);left:0;min-width:240px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:var(--bg-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:13.5px;z-index:20}

.side-box h3{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.empty{padding:22px 0;color:var(--ink-3);font-size:14px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.foot p{margin:0;max-width:74ch}
.theme-btn{background:none;border:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;align-self:flex-start}
.art-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);text-decoration:none;align-items:baseline}
.art-row:hover b{color:var(--gold-ink)}
.art-row b{font-family:var(--mono);font-size:12.5px;font-weight:500}
.art-row span{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:560px){.art-row{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.hgroup{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 4px}
.loading{padding:60px 0;color:var(--ink-3);font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}

/* Movimento e cartões */
.btn:hover{transform:translateY(-1px)}
.reveal{animation:sobe .35s ease}
@keyframes sobe{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.soft .reveal{animation:none}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.btn:hover{transform:none}}
.ico{width:18px;height:18px;flex:none;vertical-align:-3px}
</style>
